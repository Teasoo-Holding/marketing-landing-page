name: Marketing Deployment

on:
  push:
    branches: [main, staging]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable 

      - name: Build Marketing Site
        run: yarn build 

      - name: Set Target Directory
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "TARGET_DIR=/var/www/esghorizon/marketing" >> $GITHUB_ENV
          else
            echo "TARGET_DIR=/var/www/esghorizon/marketing-staging" >> $GITHUB_ENV
          fi

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "out/*" 
          target: ${{ env.TARGET_DIR }}
          strip_components: 1

      - name: Set Permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            chown -R www-data:www-data ${{ env.TARGET_DIR }}
            chmod -R 755 ${{ env.TARGET_DIR }}