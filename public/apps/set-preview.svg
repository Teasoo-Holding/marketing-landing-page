    <rect x="240" y="655" width="260" height="12" rx="6" fill="#e5e7eb"/><rect x="240" y="655" width="208" height="12" rx="6" fill="#2f5bd6"/>
    <text x="512" y="666" font-weight="600" fill="#1f2937">80%</text>
    <text x="64" y="700">Grievances resolved</text>
    <rect x="240" y="689" width="260" height="12" rx="6" fill="#e5e7eb"/><rect x="240" y="689" width="182" height="12" rx="6" fill="#2f5bd6"/>
    <text x="512" y="700" font-weight="600" fill="#1f2937">70%</text>
    <text x="64" y="734">Employment pledges</text>
    <rect x="240" y="723" width="260" height="12" rx="6" fill="#e5e7eb"/><rect x="240" y="723" width="143" height="12" rx="6" fill="#2f5bd6"/>
    <text x="512" y="734" font-weight="600" fill="#1f2937">55%</text>
