    </g>
  </g>
  <g font-size="12" fill="#4b5563">
    <rect x="300" y="276" width="12" height="12" rx="3" fill="#2f5bd6"/><text x="318" y="287">Positive</text>
    <rect x="384" y="276" width="12" height="12" rx="3" fill="#cbd5e1"/><text x="402" y="287">Neutral</text>
    <rect x="462" y="276" width="12" height="12" rx="3" fill="#dc2626" opacity="0.85"/><text x="480" y="287">Negative</text>
