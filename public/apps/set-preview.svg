    <text x="64" y="190" font-size="36" font-weight="700" fill="#1f2937">248</text>
    <text x="64" y="214" font-size="13" font-weight="600" fill="#16a34a">▲ 18% vs last quarter</text>
  </g>
  <g>
    <rect x="310" y="112" width="250" height="118" rx="16" fill="#f8fafc" stroke="#e5e7eb"/>
    <text x="334" y="146" font-size="14" fill="#6b7280">Open commitments</text>
    <text x="334" y="190" font-size="36" font-weight="700" fill="#1f2937">37</text>
    <text x="334" y="214" font-size="13" font-weight="600" fill="#d97706">9 due this month</text>
  </g>
  <g>
    <rect x="580" y="112" width="250" height="118" rx="16" fill="#f8fafc" stroke="#e5e7eb"/>
    <text x="604" y="146" font-size="14" fill="#6b7280">High-risk stakeholders</text>
