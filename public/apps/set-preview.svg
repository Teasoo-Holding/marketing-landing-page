      <text x="44" y="56" font-size="13" fill="#6b7280">Site visit · EIA follow-up</text>
      <rect x="372" y="25" width="92" height="28" rx="14" fill="#fef3c7"/><text x="418" y="44" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">Medium</text>
    </g>
    <g transform="translate(604 514)">
      <rect width="482" height="78" rx="12" fill="#f8fafc"/>
      <circle cx="24" cy="39" r="7" fill="#16a34a"/>
      <text x="44" y="32" font-weight="600" fill="#1f2937">Fisherfolk cooperative</text>
      <text x="44" y="56" font-size="13" fill="#6b7280">Meeting · Livelihood programme</text>
      <rect x="372" y="25" width="92" height="28" rx="14" fill="#dcfce7"/><text x="418" y="44" font-size="12" font-weight="600" fill="#15803d" text-anchor="middle">Low risk</text>
    </g>
    <g transform="translate(604 604)">
      <rect width="482" height="78" rx="12" fill="#f8fafc"/>
      <circle cx="24" cy="39" r="7" fill="#16a34a"/>
      <text x="44" y="32" font-weight="600" fill="#1f2937">Traditional council</text>
      <text x="44" y="56" font-size="13" fill="#6b7280">Courtesy visit · MoU signed</text>
      <rect x="372" y="25" width="92" height="28" rx="14" fill="#dbeafe"/><text x="418" y="44" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">Commitment</text>
    </g>
  </g>
  <text x="604" y="736" font-size="13" font-weight="600" fill="#2f5bd6">View all 248 engagements →</text>

  <!-- Commitments progress -->
  <rect x="40" y="572" width="520" height="192" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="64" y="608" font-size="16" font-weight="700" fill="#1f2937">Commitments delivered</text>
  <text x="64" y="630" font-size="13" fill="#6b7280">Promises made to stakeholders, tracked to completion</text>
  <g font-size="13" fill="#4b5563">
