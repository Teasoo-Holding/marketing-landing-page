    <g><rect x="78" y="0" width="52" height="50" fill="#dc2626" opacity="0.85"/><rect x="78" y="50" width="52" height="66" fill="#cbd5e1"/><rect x="78" y="116" width="52" height="74" fill="#2f5bd6"/></g>
    <g><rect x="156" y="0" width="52" height="44" fill="#dc2626" opacity="0.85"/><rect x="156" y="44" width="52" height="62" fill="#cbd5e1"/><rect x="156" y="106" width="52" height="84" fill="#2f5bd6"/></g>
    <g><rect x="234" y="0" width="52" height="38" fill="#dc2626" opacity="0.85"/><rect x="234" y="38" width="52" height="58" fill="#cbd5e1"/><rect x="234" y="96" width="52" height="94" fill="#2f5bd6"/></g>
