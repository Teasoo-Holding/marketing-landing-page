<svg width="1150" height="805" viewBox="0 0 1150 805" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <title>Teasoo SET stakeholder engagement dashboard (illustration)</title>
  <rect width="1150" height="805" rx="36" fill="#ffffff"/>
  <!-- Header -->
  <rect x="40" y="40" width="40" height="40" rx="10" fill="#2f5bd6"/>
  <text x="60" y="68" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
  <text x="96" y="58" font-size="20" font-weight="700" fill="#1f2937">Stakeholder Engagement</text>
  <text x="96" y="80" font-size="14" fill="#6b7280">Niger Delta operations · Q3 2026</text>
  <rect x="930" y="44" width="180" height="34" rx="17" fill="#eef2fd"/>
  <circle cx="952" cy="61" r="6" fill="#16a34a"/>
