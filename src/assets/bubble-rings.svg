<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Large overlapping circles — abstract molecular / bubble field -->

  <!-- Far left cluster -->
  <circle cx="80"  cy="150" r="120" stroke="white" stroke-width="1"   fill="none" opacity="0.18"/>
  <circle cx="80"  cy="150" r="70"  stroke="white" stroke-width="0.7" fill="none" opacity="0.12"/>
  <circle cx="80"  cy="150" r="30"  fill="white" opacity="0.04"/>

  <!-- Left-centre -->
  <circle cx="280" cy="90"  r="80"  stroke="white" stroke-width="0.8" fill="none" opacity="0.15"/>
  <circle cx="280" cy="90"  r="40"  stroke="white" stroke-width="0.5" fill="none" opacity="0.1"/>

  <!-- Centre large -->
  <circle cx="600" cy="160" r="150" stroke="white" stroke-width="1.2" fill="none" opacity="0.16"/>
  <circle cx="600" cy="160" r="90"  stroke="white" stroke-width="0.8" fill="none" opacity="0.1"/>
  <circle cx="600" cy="160" r="35"  fill="white" opacity="0.04"/>

  <!-- Right-centre -->
  <circle cx="860" cy="80"  r="100" stroke="white" stroke-width="0.8" fill="none" opacity="0.14"/>
  <circle cx="860" cy="80"  r="50"  stroke="white" stroke-width="0.5" fill="none" opacity="0.09"/>

  <!-- Far right -->
  <circle cx="1100" cy="180" r="90"  stroke="white" stroke-width="1"   fill="none" opacity="0.16"/>
  <circle cx="1100" cy="180" r="50"  stroke="white" stroke-width="0.6" fill="none" opacity="0.1"/>
  <circle cx="1100" cy="180" r="20"  fill="white" opacity="0.04"/>

  <!-- Extra small scattered bubbles -->
  <circle cx="420" cy="240" r="40"  stroke="white" stroke-width="0.6" fill="none" opacity="0.1"/>
  <circle cx="730" cy="50"  r="55"  stroke="white" stroke-width="0.6" fill="none" opacity="0.1"/>
  <circle cx="960" cy="250" r="35"  stroke="white" stroke-width="0.5" fill="none" opacity="0.09"/>
  <circle cx="170" cy="260" r="28"  stroke="white" stroke-width="0.5" fill="none" opacity="0.08"/>

  <!-- Connecting bond lines between bubble centres -->
  <line x1="80"  y1="150" x2="280" y2="90"  stroke="white" stroke-width="0.5" opacity="0.08" stroke-dasharray="6 6"/>
  <line x1="280" y1="90"  x2="600" y2="160" stroke="white" stroke-width="0.5" opacity="0.07" stroke-dasharray="6 6"/>
  <line x1="600" y1="160" x2="860" y2="80"  stroke="white" stroke-width="0.5" opacity="0.07" stroke-dasharray="6 6"/>
  <line x1="860" y1="80"  x2="1100" y2="180" stroke="white" stroke-width="0.5" opacity="0.07" stroke-dasharray="6 6"/>

  <!-- Small node dots at bond junctions -->
  <circle cx="80"   cy="150" r="4" fill="white" opacity="0.2"/>
  <circle cx="280"  cy="90"  r="4" fill="white" opacity="0.18"/>
  <circle cx="600"  cy="160" r="5" fill="white" opacity="0.2"/>
  <circle cx="860"  cy="80"  r="4" fill="white" opacity="0.18"/>
  <circle cx="1100" cy="180" r="4" fill="white" opacity="0.2"/>
</svg>
