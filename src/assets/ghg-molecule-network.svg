<?xml version="1.0" encoding="UTF-8"?>
<svg width="520" height="520" viewBox="0 0 520 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Orbital rings -->
  <circle cx="260" cy="260" r="180" stroke="#0F6E56" stroke-width="1.5"/>
  <circle cx="260" cy="260" r="120" stroke="#0F6E56" stroke-width="1"/>
  <circle cx="260" cy="260" r="60" stroke="#0F6E56" stroke-width="1"/>

  <!-- Bond lines -->
  <line x1="260" y1="260" x2="380" y2="160" stroke="#0F6E56" stroke-width="1.8"/>
  <line x1="260" y1="260" x2="140" y2="340" stroke="#0F6E56" stroke-width="1.8"/>
  <line x1="260" y1="260" x2="400" y2="340" stroke="#1D9E75" stroke-width="1.3"/>
  <line x1="260" y1="260" x2="160" y2="180" stroke="#1D9E75" stroke-width="1.3"/>
  <line x1="260" y1="260" x2="80"  y2="260" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="260" y1="260" x2="440" y2="260" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="260" y1="260" x2="260" y2="80"  stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="260" y1="260" x2="260" y2="440" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Secondary bonds between outer atoms -->
  <line x1="380" y1="160" x2="400" y2="340" stroke="#085041" stroke-width="0.8" stroke-dasharray="3 5" opacity="0.5"/>
  <line x1="140" y1="340" x2="160" y2="180" stroke="#085041" stroke-width="0.8" stroke-dasharray="3 5" opacity="0.5"/>

  <!-- Outer satellite atoms -->
  <circle cx="80"  cy="260" r="10" fill="#0F6E56" opacity="0.5"/>
  <circle cx="440" cy="260" r="10" fill="#0F6E56" opacity="0.5"/>
  <circle cx="260" cy="80"  r="10" fill="#0F6E56" opacity="0.5"/>
  <circle cx="260" cy="440" r="10" fill="#0F6E56" opacity="0.5"/>

  <!-- Mid atoms — CO2 type (amber = Oxygen) -->
  <circle cx="400" cy="340" r="14" fill="#EF9F27"/>
  <circle cx="160" cy="180" r="14" fill="#EF9F27"/>

  <!-- Primary branch atoms — Carbon type (teal) -->
  <circle cx="380" cy="160" r="18" fill="#1D9E75"/>
  <circle cx="140" cy="340" r="18" fill="#1D9E75"/>

  <!-- Centre nucleus -->
  <circle cx="260" cy="260" r="28" fill="#0F6E56"/>
  <circle cx="260" cy="260" r="16" fill="#085041"/>
  <circle cx="260" cy="260" r="7"  fill="#9FE1CB"/>

  <!-- Atom labels -->
  <text x="380" y="155" font-family="monospace" font-size="10" fill="#1D9E75" text-anchor="middle" font-weight="600">C</text>
  <text x="140" y="335" font-family="monospace" font-size="10" fill="#1D9E75" text-anchor="middle" font-weight="600">C</text>
  <text x="400" y="335" font-family="monospace" font-size="10" fill="#EF9F27" text-anchor="middle" font-weight="600">O</text>
  <text x="160" y="175" font-family="monospace" font-size="10" fill="#EF9F27" text-anchor="middle" font-weight="600">O</text>
  <text x="260" y="265" font-family="monospace" font-size="11" fill="#9FE1CB" text-anchor="middle" font-weight="700">CO₂</text>
</svg>
