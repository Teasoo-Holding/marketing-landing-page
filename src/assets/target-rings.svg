<?xml version="1.0" encoding="UTF-8"?>
<svg width="460" height="460" viewBox="0 0 460 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Concentric rings — radiating outward -->
  <circle cx="230" cy="230" r="200" stroke="#9FE1CB" stroke-width="1.5" fill="none"/>
  <circle cx="230" cy="230" r="160" stroke="#9FE1CB" stroke-width="1.2" fill="none" opacity="0.85"/>
  <circle cx="230" cy="230" r="120" stroke="#9FE1CB" stroke-width="1"   fill="none" opacity="0.7"/>
  <circle cx="230" cy="230" r="80"  stroke="#9FE1CB" stroke-width="0.9" fill="none" opacity="0.55"/>
  <circle cx="230" cy="230" r="45"  stroke="#9FE1CB" stroke-width="0.8" fill="none" opacity="0.4"/>

  <!-- Crosshair lines -->
  <line x1="230" y1="28"  x2="230" y2="432" stroke="#9FE1CB" stroke-width="0.6" opacity="0.4"/>
  <line x1="28"  y1="230" x2="432" y2="230" stroke="#9FE1CB" stroke-width="0.6" opacity="0.4"/>

  <!-- Diagonal guides -->
  <line x1="88"  y1="88"  x2="372" y2="372" stroke="#9FE1CB" stroke-width="0.5" opacity="0.28"/>
  <line x1="88"  y1="372" x2="372" y2="88"  stroke="#9FE1CB" stroke-width="0.5" opacity="0.28"/>

  <!-- Filled glow rings -->
  <circle cx="230" cy="230" r="30" fill="#9FE1CB" opacity="0.12"/>
  <circle cx="230" cy="230" r="15" fill="#9FE1CB" opacity="0.35"/>
  <circle cx="230" cy="230" r="7"  fill="#9FE1CB" opacity="0.7"/>

  <!-- Cardinal tick marks on outer ring -->
  <!-- Top -->
  <line x1="230" y1="28" x2="230" y2="42" stroke="#9FE1CB" stroke-width="1.5" opacity="0.5"/>
  <!-- Bottom -->
  <line x1="230" y1="418" x2="230" y2="432" stroke="#9FE1CB" stroke-width="1.5" opacity="0.5"/>
  <!-- Left -->
  <line x1="28" y1="230" x2="42" y2="230" stroke="#9FE1CB" stroke-width="1.5" opacity="0.5"/>
  <!-- Right -->
  <line x1="418" y1="230" x2="432" y2="230" stroke="#9FE1CB" stroke-width="1.5" opacity="0.5"/>

  <!-- 45° tick marks -->
  <line x1="88"  y1="88"  x2="98"  y2="98"  stroke="#9FE1CB" stroke-width="1" opacity="0.35"/>
  <line x1="372" y1="88"  x2="362" y2="98"  stroke="#9FE1CB" stroke-width="1" opacity="0.35"/>
  <line x1="88"  y1="372" x2="98"  y2="362" stroke="#9FE1CB" stroke-width="1" opacity="0.35"/>
  <line x1="372" y1="372" x2="362" y2="362" stroke="#9FE1CB" stroke-width="1" opacity="0.35"/>

  <!-- Small orbit dots at cardinal points of inner ring -->
  <circle cx="230" cy="70"  r="5" fill="#9FE1CB" opacity="0.5"/>
  <circle cx="230" cy="390" r="5" fill="#9FE1CB" opacity="0.5"/>
  <circle cx="70"  cy="230" r="5" fill="#9FE1CB" opacity="0.5"/>
  <circle cx="390" cy="230" r="5" fill="#9FE1CB" opacity="0.5"/>

  <!-- Animated-looking arc segment (static) -->
  <path d="M 230 30 A 200 200 0 0 1 406 318" stroke="#1D9E75" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.4"/>
</svg>
