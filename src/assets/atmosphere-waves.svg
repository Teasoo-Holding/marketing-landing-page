<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Atmospheric wave layers — each a different opacity suggesting altitude strata -->

  <!-- Layer 1 — lowest, strongest -->
  <path d="M0 280 Q150 180 300 280 Q450 380 600 280 Q750 180 900 280 Q1050 380 1200 280"
        stroke="#1D9E75" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Layer 2 -->
  <path d="M0 310 Q150 210 300 310 Q450 410 600 310 Q750 210 900 310 Q1050 410 1200 310"
        stroke="#1D9E75" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Layer 3 -->
  <path d="M0 250 Q150 150 300 250 Q450 350 600 250 Q750 150 900 250 Q1050 350 1200 250"
        stroke="#1D9E75" stroke-width="1.2" fill="none" opacity="0.4"/>

  <!-- Layer 4 — higher altitude, shorter amplitude -->
  <path d="M0 200 Q200 140 400 200 Q600 260 800 200 Q1000 140 1200 200"
        stroke="#0F6E56" stroke-width="1" fill="none" opacity="0.35"/>

  <!-- Layer 5 — stratosphere -->
  <path d="M0 155 Q200 115 400 155 Q600 195 800 155 Q1000 115 1200 155"
        stroke="#0F6E56" stroke-width="0.8" fill="none" opacity="0.25"/>

  <!-- Layer 6 — high atmosphere -->
  <path d="M0 110 Q250 80 500 110 Q750 140 1000 110 Q1100 98 1200 110"
        stroke="#0F6E56" stroke-width="0.6" fill="none" opacity="0.18"/>

  <!-- Layer 7 — near space -->
  <path d="M0 70 Q300 50 600 70 Q900 90 1200 70"
        stroke="#085041" stroke-width="0.5" fill="none" opacity="0.12"/>

  <!-- Ground line -->
  <line x1="0" y1="370" x2="1200" y2="370" stroke="#0F6E56" stroke-width="1" opacity="0.2"/>

  <!-- Floating molecule dots scattered along waves -->
  <circle cx="150" cy="230" r="4" fill="#1D9E75" opacity="0.35"/>
  <circle cx="350" cy="295" r="3" fill="#1D9E75" opacity="0.3"/>
  <circle cx="600" cy="225" r="5" fill="#0F6E56" opacity="0.25"/>
  <circle cx="800" cy="285" r="3" fill="#1D9E75" opacity="0.3"/>
  <circle cx="1000" cy="235" r="4" fill="#1D9E75" opacity="0.28"/>
  <circle cx="450" cy="170" r="3" fill="#0F6E56" opacity="0.22"/>
  <circle cx="750" cy="160" r="3" fill="#0F6E56" opacity="0.2"/>

  <!-- GHG labels at wave crests -->
  <text x="300" y="268" font-family="monospace" font-size="10" fill="#1D9E75" opacity="0.4" text-anchor="middle">CO₂</text>
  <text x="600" y="268" font-family="monospace" font-size="10" fill="#1D9E75" opacity="0.35" text-anchor="middle">CH₄</text>
  <text x="900" y="268" font-family="monospace" font-size="10" fill="#1D9E75" opacity="0.32" text-anchor="middle">N₂O</text>

  <!-- Sun circle top-right -->
  <circle cx="1120" cy="80" r="45" stroke="#EF9F27" stroke-width="1.2" fill="none" opacity="0.25"/>
  <circle cx="1120" cy="80" r="30" fill="#EF9F27" opacity="0.1"/>
  <!-- Sun rays -->
  <line x1="1120" y1="25" x2="1120" y2="10" stroke="#EF9F27" stroke-width="1" opacity="0.2"/>
  <line x1="1120" y1="135" x2="1120" y2="150" stroke="#EF9F27" stroke-width="1" opacity="0.2"/>
  <line x1="1065" y1="80" x2="1050" y2="80" stroke="#EF9F27" stroke-width="1" opacity="0.2"/>
  <line x1="1175" y1="80" x2="1190" y2="80" stroke="#EF9F27" stroke-width="1" opacity="0.2"/>
  <line x1="1081" y1="41" x2="1070" y2="30" stroke="#EF9F27" stroke-width="1" opacity="0.15"/>
  <line x1="1159" y1="119" x2="1170" y2="130" stroke="#EF9F27" stroke-width="1" opacity="0.15"/>
</svg>
