# Maintenance mode: while a flag file named after the site's host exists, every page on that
# site answers 503 with the maintenance page. The error pages, logo and favicon stay reachable.
#   live on:     touch /var/www/esghorizon/maintenance/esghorizon.africa
#   staging on:  touch /var/www/esghorizon/maintenance/staging-marketing.esghorizon.africa
#   off:         rm /var/www/esghorizon/maintenance/<host>
set $esg_maintenance 0;
if (-f /var/www/esghorizon/maintenance/$host) {
    set $esg_maintenance 1;
}
if ($uri ~ ^/(errors/|logo-full\.png$|favicon\.ico$)) {
    set $esg_maintenance 0;
}
if ($esg_maintenance = 1) {
    return 503;
}
